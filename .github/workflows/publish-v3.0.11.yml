name: Publish MLDDS 3.0.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v3.0.11.yml
      - artifacts/v3.0.11/**
      - releases/v3.0.11/**

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify installer
        shell: pwsh
        run: |
          $expected = '3F4ADE12B04A04343A3CC79FC5D1FA198568EB6D5EF963B23192FC950C549F8D'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath 'artifacts/v3.0.11/MLDDS-3.0.11-Setup.exe').Hash
          if ($actual -ne $expected) { throw "Installer hash mismatch: $actual" }

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'artifacts/v3.0.11/MLDDS-3.0.11-Setup.exe',
            'releases/v3.0.11/MLDDS-3.0.11-Setup.exe.sha256'
          )
          if (gh release view v3.0.11 --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload v3.0.11 @assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit v3.0.11 --title 'MLDDS 3.0.11' --notes-file 'releases/v3.0.11/RELEASE-NOTES.md' --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v3.0.11 @assets --verify-tag --title 'MLDDS 3.0.11' --notes-file 'releases/v3.0.11/RELEASE-NOTES.md' --latest --repo $env:GITHUB_REPOSITORY
          }
